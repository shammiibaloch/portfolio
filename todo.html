<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium To-Do - by You</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body<a href="Portfolio.html" style="position:fixed;top:15px;left:15px;z-index:9999;background:#111;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:bold;">← Back to Portfolio</a>{min-height:100vh;background:linear-gradient(135deg,#a18cd1,#fbc2eb);display:flex;justify-content:center;padding:16px}
.card{width:100%;max-width:480px;background:#fffffff2;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.25);margin-top:20px;height:fit-content}
h1{text-align:center}
.sub{text-align:center;color:#666;font-size:13px;margin-top:4px}
.add{display:flex;gap:8px;margin:18px 0}
.add input{flex:1;padding:12px;border:2px solid #e2e8f0;border-radius:12px}
.add button{padding:12px 18px;background:#7c3aed;color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.filters button{padding:6px 12px;border:none;background:#edf2f7;border-radius:20px;font-size:12px;cursor:pointer}
.filters button.active{background:#7c3aed;color:white}
#list{list-style:none}
#list li{background:#f7fafc;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
#list li.done{opacity:0.5;text-decoration:line-through}
#list li span{flex:1}
.icon-btn{border:none;background:none;cursor:pointer;font-size:16px}
.stats{text-align:center;margin-top:14px;color:#666;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h1>✅ My Tasks</h1>
<p class="sub">Your tasks stay saved even after closing</p>
<div class="add">
<input id="taskInput" placeholder="Add new task... e.g. Reply to client">
<button onclick="addTask()">Add</button>
</div>
<div class="filters">
<button id="f-all" class="active" onclick="setFilter('all')">All</button>
<button id="f-active" onclick="setFilter('active')">Active</button>
<button id="f-done" onclick="setFilter('done')">Done</button>
</div>
<ul id="list"></ul>
<div class="stats" id="stats">0 tasks</div>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem('my_tasks') || '[]');
let filter = 'all';

function save(){ localStorage.setItem('my_tasks', JSON.stringify(tasks)); }

function addTask(){
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if(!text) return;
  tasks.unshift({id:Date.now(), text:text, done:false});
  input.value=''; save(); render();
}

function toggle(id){
  tasks = tasks.map(t=> t.id===id ? {...t, done:!t.done} : t);
  save(); render();
}
function del(id){
  tasks = tasks.filter(t=> t.id!==id);
  save(); render();
}
function editTask(id){
  const t = tasks.find(x=>x.id===id);
  const newText = prompt('Edit task:', t.text);
  if(newText!==null && newText.trim()!==''){
    t.text = newText.trim(); save(); render();
  }
}
function setFilter(f){
  filter=f;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  document.getElementById('f-'+f).classList.add('active');
  render();
}
function render(){
  const list = document.getElementById('list');
  let show = tasks;
  if(filter==='active') show = tasks.filter(t=>!t.done);
  if(filter==='done') show = tasks.filter(t=>t.done);
  
  list.innerHTML = show.map(t=> `
    <li class="${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})">
      <span onclick="editTask(${t.id})">${t.text}</span>
      <button class="icon-btn" onclick="del(${t.id})">🗑️</button>
    </li>
  `).join('');
  document.getElementById('stats').textContent = `${tasks.filter(t=>!t.done).length} active • ${tasks.length} total — Click text to edit`;
}
document.getElementById('taskInput').addEventListener('keypress', e=>{ if(e.key==='Enter') addTask(); });
render();
</script>
</body>
</html>
